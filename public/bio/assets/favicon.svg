<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B120E"/>
      <stop offset="100%" stop-color="#14231B"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="bioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bioBg)" stroke="#1B2D24" stroke-width="1.5"/>

  <!-- Organic leaf / cell membrane motif -->
  <path d="M32 12 C46 16, 52 30, 48 44 C42 52, 28 52, 16 44 C12 30, 18 16, 32 12 Z" fill="url(#leafGrad)" opacity="0.9" filter="url(#bioGlow)"/>

  <!-- Leaf vein / internal hierarchy -->
  <path d="M32 16 Q32 34 32 48" stroke="#EFF4F0" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M32 26 Q40 22 43 24" stroke="#EFF4F0" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M32 34 Q24 30 21 32" stroke="#EFF4F0" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M32 40 Q39 37 42 39" stroke="#EFF4F0" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Cellular energy ATP spark -->
  <circle cx="32" cy="15" r="2.5" fill="#FBBF24" filter="url(#bioGlow)"/>
</svg>
