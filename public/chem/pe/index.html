  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"></script>

  <!-- Pre-paint Theme Initialization -->
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem('gc-theme') || (localStorage.getItem('sp_dark_mode') === 'true' ? 'dark' : (localStorage.getItem('sp_dark_mode') === 'false' ? 'light' : null));
      } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = saved === 'dark' || (!saved && prefersDark);
      if (isDark) {
        document.documentElement.classList.add('dark', 'theme-dark');
        document.documentElement.classList.remove('light', 'theme-light');
      } else {
        document.documentElement.classList.add('light', 'theme-light');
        document.documentElement.classList.remove('dark', 'theme-dark');
      }
    })();
  </script>
</head>
