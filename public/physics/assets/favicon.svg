<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="physBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="physGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#physBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Orbital ellipse 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6" transform="rotate(-30 32 32)"/>
  
  <!-- Orbital ellipse 2 -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#60A5FA" stroke-width="1.8" opacity="0.75" transform="rotate(30 32 32)"/>

  <!-- Central nucleus / particle core -->
  <circle cx="32" cy="32" r="5" fill="url(#physGlow)" filter="url(#vectorGlow)"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>

  <!-- Orbiting electrons / field points -->
  <circle cx="49" cy="22" r="2.5" fill="#93C5FD" filter="url(#vectorGlow)"/>
  <circle cx="15" cy="42" r="2.5" fill="#3B82F6" filter="url(#vectorGlow)"/>
  <circle cx="32" cy="10" r="2" fill="#FBBF24"/>
</svg>
