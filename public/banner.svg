
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="630" fill="#0F172A"/>
    
    <!-- Abstract Glow Effects -->
    <g filter="url(#filter0_f)">
        <circle cx="150" cy="100" r="300" fill="#10B981" fill-opacity="0.15"/>
        <circle cx="1050" cy="530" r="300" fill="#6366F1" fill-opacity="0.15"/>
    </g>

    <!-- Content Container -->
    <g transform="translate(600, 315)" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
        
        <!-- Badge -->
        <rect x="-120" y="-140" width="240" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2"/>
        <text x="0" y="-113" fill="#34D399" font-size="16" font-weight="800" letter-spacing="3">AI-POWERED</text>

        <!-- Main Title -->
        <text x="0" y="20" fill="white" font-size="80" font-weight="900" letter-spacing="-2">
            Science
        </text>
        <text x="0" y="110" fill="url(#paint0_linear)" font-size="80" font-weight="900" letter-spacing="-2">
            Practice Partner
        </text>

        <!-- Subtitle -->
        <text x="0" y="180" fill="#94A3B8" font-size="28" font-weight="500">
            Unlimited, AI-powered, science practice
        </text>
    </g>

    <!-- Decorative Elements (Atoms) -->
    <g opacity="0.1" stroke="white" stroke-width="2" fill="none">
        <circle cx="150" cy="150" r="40"/>
        <ellipse cx="150" cy="150" rx="20" ry="50" transform="rotate(45 150 150)"/>
        <ellipse cx="150" cy="150" rx="20" ry="50" transform="rotate(-45 150 150)"/>
        <circle cx="150" cy="150" r="6" fill="white"/>
    </g>

    <g opacity="0.1" stroke="white" stroke-width="2" fill="none" transform="translate(950, 400)">
        <path d="M50 0 C20 0 0 20 0 50 C0 80 20 100 50 100 C80 100 100 80 100 50 C100 20 80 0 50 0 Z M50 20 C65 20 80 35 80 50 C80 65 65 80 50 80 C35 80 20 65 20 50 C20 35 35 20 50 20 Z"/>
    </g>

    <!-- Definitions -->
    <defs>
        <filter id="filter0_f" x="-350" y="-400" width="1900" height="1430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feFlood flood-opacity="0" result="BackgroundImageFix"/>
            <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
            <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur"/>
        </filter>
        <linearGradient id="paint0_linear" x1="-300" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#34D399"/>
            <stop offset="1" stop-color="#818CF8"/>
        </linearGradient>
    </defs>
</svg>
