<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        if (window.location.hostname === 'chem.sciencepractice.app') {
            var p = window.location.pathname;
            var targetPath = p.startsWith('/chem') ? p : ('/chem' + (p === '/' ? '/' : p));
            window.location.replace('https://sciencepractice.app' + targetPath + window.location.search + window.location.hash);
        } else if (window.location.hostname === 'physics.sciencepractice.app') {
            var p = window.location.pathname;
            var targetPath = p.startsWith('/physics') ? p : ('/physics' + (p === '/' ? '/' : p));
            window.location.replace('https://sciencepractice.app' + targetPath + window.location.search + window.location.hash);
        } else if (window.location.hostname === 'bio.sciencepractice.app') {
            var p = window.location.pathname;
            var targetPath = p.startsWith('/bio') ? p : ('/bio' + (p === '/' ? '/' : p));
            window.location.replace('https://sciencepractice.app' + targetPath + window.location.search + window.location.hash);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Practice Partner</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Science Practice Partner">
    <meta name="description" content="Science Supports for Science Students">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sciencepractice.app/">
    <meta property="og:title" content="Science Practice Partner">
    <meta property="og:description" content="Science Supports for Science Students">
    <meta property="og:image" content="https://sciencepractice.app/banner.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://sciencepractice.app/">
    <meta property="twitter:title" content="Science Practice Partner">
    <meta property="twitter:description" content="Science Supports for Science Students">
    <meta property="twitter:image" content="https://sciencepractice.app/banner.png">

    <!-- Clear Stale Service Workers to Prevent White Screens -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister()
                }
            })
        }
    </script>

    <!-- Google Identity Services (Sign In With Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Science Practice">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: {
                            light: '#F8F9FB',
                            dark: '#12141C',
                        },
                        card: {
                            light: '#FFFFFF',
                            dark: '#1E212A',
                        },
                        textPrimary: {
                            light: '#1A1C21',
                            dark: '#F8F9FB',
                        },
                        textSecondary: {
                            light: '#64748B',
                            dark: '#94A3B8',
                        },
                        brandPrimary: {
                            light: '#6366F1',
                            dark: '#818CF8',
                        },
                        mint: '#4ADE80',
                        coral: '#FB7185',
                        skyBlue: '#38BDF8',
                        lavender: '#A78BFA',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        rounded: ['Quicksand', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    },
                    fontSize: {
                        '3xs': ['0.5rem', { lineHeight: '0.75rem' }],
                        '2xs': ['0.625rem', { lineHeight: '0.875rem' }],
                    },
                    borderRadius: {
                        'bento': '24px',
                        'bubble': '20px',
                        'pill': '9999px',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;700&family=Fira+Code&family=Archivo+Black&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FB;
            color: #1A1C21;
            transition: background-color 300ms ease-in-out, color 300ms ease-in-out;
        }

        html.dark body {
            background-color: #12141C;
            color: #F8F9FB;
        }

        h1, h2, h3, h4, h5, h6, .font-rounded {
            font-family: 'Quicksand', sans-serif !important;
            font-weight: 700;
        }

        .font-mono {
            font-family: 'Fira+Code', monospace;
        }

        .font-display {
            font-family: 'Archivo Black', 'Inter', sans-serif;
            font-weight: 900;
        }

        /* --- Bento Grid & Bubbly Elements --- */
        .bento-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.01);
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        .bento-card.cursor-pointer:hover,
        button.bento-card:hover,
        .bento-card-clickable:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.12);
        }
        .bento-card.cursor-pointer:active,
        button.bento-card:active,
        .bento-card-clickable:active {
            transform: scale(0.98);
        }

        html.dark .bento-card {
            background-color: #1E212A;
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: none;
        }
        html.dark .bento-card.cursor-pointer:hover,
        html.dark button.bento-card:hover,
        html.dark .bento-card-clickable:hover {
            border-color: rgba(129, 140, 248, 0.25);
            box-shadow: 0 10px 30px -10px rgba(129, 140, 248, 0.15);
        }

        html.dark .bento-card.border-mint { border-color: rgba(74, 222, 128, 0.2); }
        html.dark .bento-card.border-mint:hover { border-color: rgba(74, 222, 128, 0.4); }
        html.dark .bento-card.border-coral { border-color: rgba(251, 113, 133, 0.2); }
        html.dark .bento-card.border-coral:hover { border-color: rgba(251, 113, 133, 0.4); }
        html.dark .bento-card.border-sky { border-color: rgba(56, 189, 248, 0.2); }
        html.dark .bento-card.border-sky:hover { border-color: rgba(56, 189, 248, 0.4); }
        html.dark .bento-card.border-lavender { border-color: rgba(167, 139, 250, 0.2); }
        html.dark .bento-card.border-lavender:hover { border-color: rgba(167, 139, 250, 0.4); }

        /* Bubbly Action Buttons */
        .btn-squishy {
            border-radius: 9999px;
            font-weight: 700;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .btn-squishy:hover {
            transform: translateY(-2px);
        }
        .btn-squishy:active {
            transform: scale(0.96);
        }

        .btn-3d-light {
            box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.1), 0 8px 16px -4px rgba(99, 102, 241, 0.2);
        }
        .btn-3d-light:active {
            box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.1);
            transform: translateY(3px) scale(0.98);
        }

        .btn-3d-dark {
            box-shadow: 0 0 12px 2px rgba(129, 140, 248, 0.15);
        }
        .btn-3d-dark:active {
            box-shadow: 0 0 4px 1px rgba(129, 140, 248, 0.1);
            transform: translateY(1px) scale(0.98);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        html.dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @keyframes jeopardy-marquee {
            0% { transform: translateX(0); }
            10% { transform: translateX(0); }
            90% { transform: translateX(var(--marquee-distance, -50%)); }
            100% { transform: translateX(var(--marquee-distance, -50%)); }
        }

        .jeopardy-marquee {
            display: inline-block;
            animation: jeopardy-marquee 8s ease-in-out infinite alternate;
        }

        /* Accessibility / Dyslexia Mode Overrides */
        body.accessibility-mode {
            font-family: 'Verdana', 'Segoe UI', sans-serif !important;
            line-height: 1.8 !important;
            letter-spacing: 0.05em !important;
        }

        body.accessibility-mode h1,
        body.accessibility-mode h2,
        body.accessibility-mode h3,
        body.accessibility-mode h4 {
            letter-spacing: 0.1em !important;
        }

        body.accessibility-mode p,
        body.accessibility-mode li,
        body.accessibility-mode span {
            font-weight: 500 !important;
            /* Slightly bolder for readability */
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Styles for AI Generated Tables in FRQs */
        .frq-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .frq-table th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 700;
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .frq-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }

        .frq-table tr:last-child td {
            border-bottom: none;
        }

        .frq-table tr:hover td {
            background-color: #f8fafc;
        }

        /* --- Gamification Animations --- */
        @keyframes holographic {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .ultra-rare-shine {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 20%, rgba(255, 192, 203, 0.3) 40%, rgba(255, 255, 255, 0) 60%, rgba(135, 206, 235, 0.3) 80%, rgba(255, 255, 255, 0.4) 100%);
            background-size: 200% 200%;
            animation: holographic 3s ease infinite;
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* --- Forms & Inputs --- */
        /* Force Spinner Buttons to be visible */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            opacity: 1;
            margin-right: 6px;
        }

        @media print {
            @page {
                margin: 0.5cm;
                size: auto;
            }

            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: white !important;
            }

            .no-print {
                display: none !important;
            }

            .print-break-avoid {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            .print-full-width {
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
        }
    </style>

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
