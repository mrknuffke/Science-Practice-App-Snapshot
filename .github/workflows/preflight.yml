# The same preflight as the local pre-push hook, on a clean machine.
#
# Vercel deploys main on push regardless of this, so the pre-push hook is the
# real gate; this is the clean-room check that nothing passed only because of
# local state. It runs `npm run verify` (diagrams, tsc -b, lint, vitest incl.
# the drift guards, vite build) and then what only a served build can show:
# every public route and every textbook lesson resolving, and the browser
# smoke suite.
#
# There was a second workflow, ci.yml, added on 2026-09-05 when this repo had
# no CI at all and its two unit tests had never run automatically. Preflight
# superseded it on 2026-09-17: `npm run verify` is a strict superset of what
# ci.yml ran, and it is preflight's *first* step, so ci.yml was not even buying
# an earlier failure signal. It was deleted on 2026-09-20 rather than left to
# run build, lint and tests a second time on every push.
name: Preflight

on:
  pull_request:
  push:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Chrome is preinstalled on ubuntu-latest (playwright.config.ts uses channel: 'chrome').
      - name: Preflight
        run: npm run preflight
        env:
          PREFLIGHT_CLEAN: "1"
      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
